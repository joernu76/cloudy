# Based on the official paperless-ngx docker-compose.postgres.yml
# https://github.com/paperless-ngx/paperless-ngx/blob/main/docker/compose/docker-compose.postgres.yml
#
# Adaptations for cloudy:
#   - bind mounts to /var/paperless/ instead of Docker volumes
#   - container_name for each service
#   - tessdata_best file mounts for better OCR quality

services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - /var/paperless/valkey:/data

  db:
    image: docker.io/library/postgres:18
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - /var/paperless/postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    volumes:
      - /var/paperless/data:/usr/src/paperless/data
      - /var/paperless/media:/usr/src/paperless/media
      - /var/paperless/export:/usr/src/paperless/export
      - /var/paperless/consume:/usr/src/paperless/consume
      - /var/paperless/tessdata/deu.traineddata:/usr/share/tesseract-ocr/5/tessdata/deu.traineddata:ro
      - /var/paperless/tessdata/eng.traineddata:/usr/share/tesseract-ocr/5/tessdata/eng.traineddata:ro
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      USERMAP_UID: 1000
      USERMAP_GID: 1000

services:
  mariadb:
    image: mariadb:11.8

    container_name: nextcloud-mariadb
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --skip-innodb-read-only-compressed
    volumes:
      - /var/nextcloud/mariadb:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${STANDARD_PASSWORD}
      - MARIADB_DATABASE=nextcloud
      # Run mariadb-upgrade (after backing up system tables) on version change.
      - MARIADB_AUTO_UPGRADE=1
    # Ping over TCP, which is what nextcloud uses.  Succeeds even on "access
    # denied", so no credentials are needed; fails while the server is not
    # yet listening (including the socket-only temp server during init).
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nextcloud:
    image: nextcloud:stable
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      collabora:
        condition: service_started
    container_name: nextcloud-nextcloud
    restart: always
    volumes:
      - /var/nextcloud/nextcloud:/var/www/html 
      - /var/nextcloud/apps:/var/www/html/custom_apps 
      - /var/nextcloud/config:/var/www/html/config 
      - /var/nextcloud/data:/var/www/html/data 
    environment:
      - MYSQL_PASSWORD=${STANDARD_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=root
      - MYSQL_HOST=mariadb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=1G
      # Must be IP/CIDR (hostnames are not resolved). Docker's default pools,
      # because "compose down/up" may move the network to another subnet.
      - TRUSTED_PROXIES=172.16.0.0/12

  # HTTPS is handled by nginx
  collabora:
    image: collabora/code
    container_name: nextcloud-collabora
    restart: always
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - MKNOD
      - FOWNER
      - SYS_CHROOT
      - SYS_ADMIN
    environment:
      - password=${COLLABORA_ADMIN_PASSWORD}
      - username=nextcloud
      - server_name=${NEXTCLOUD_URL}:1123
      # Only this Nextcloud may use Collabora (default: first host after start)
      - aliasgroup1=https://${NEXTCLOUD_URL}:1124
      - DONT_GEN_SSL_CERT=1
      - "extra_params=--o:ssl.enable=false --o:ssl.termination=true"

  redis:
    image: redis:8
    container_name: nextcloud-redis
    restart: always
    volumes:
      - /var/nextcloud/redis-data:/data

  # reverse proxy for nextcloud and collabora server
  # hack to use letsencrypt running on host system
  nginx:
    image: nginx:alpine
    container_name: nextcloud-nginx
    restart: always
    ports:
      - 1124:443
      - 1123:444
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /var/nextcloud/certbot/config/live/nextcloud:/etc/nginx/certs
      - /var/nextcloud/certbot/config/archive:/etc/archive
      - /var/nextcloud/nginx:/var/log/nginx            # added to logrotate.d
    depends_on:
      - nextcloud
